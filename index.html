<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理アプリ</title>
    <!-- アイコン用ライブラリ（FontAwesome） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="app-header">
        <h1>シフト管理サイト</h1>
        <div id="user-info" class="user-info">
            <span id="user-name"></span>
            <i class="fa-solid fa-arrow-right-from-bracket" id="btn-logout" style="color: #ea4335; cursor: pointer;"
                title="ログアウト"></i>
        </div>
    </header>

    <div class="container">


        <!-- ログイン画面 -->
        <div id="login-view" class="login-view hidden">
            <h2>ログイン</h2>
            <input type="text" id="login-id" class="login-email" placeholder="従業員ID">
            <input type="password" id="login-password" class="login-password" placeholder="パスワード">
            <button id="btn-login" class="btn-login">ログイン</button>
            <p id="login-error" class="error-text"></p>
        </div>


        <!-- マイシフト画面 -->
        <div id="myshift-view" class="myshift-view hidden">
            <h2 class="view-title">マイシフト</h2>
            <div id="myshift-list" class="myshift-list"></div>
        </div>


        <!-- 全体シフト画面 -->
        <div id="allshift-view" class="allshift-view hidden">
            <h2 class="view-title">全体シフト</h2>
            <div class="calendar-header">
                <button id="prev-month" class="prev-month"><i class="fa-solid fa-chevron-left"></i></button>
                <h3 id="month-year" class="month-year"></h3>
                <button id="next-month" class="next-month"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="weekdays">
                <div>日</div>
                <div>月</div>
                <div>火</div>
                <div>水</div>
                <div>木</div>
                <div>金</div>
                <div>土</div>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <!-- 管理者設定画面 -->
        <div id="admin-view" class="admin-view hidden">
            <h2 class="view-title">管理者画面</h2>

            <div class="shift-edit-card">
                <h3 class="card-title"><i class="fa-solid fa-calendar-days"></i> シフト編集</h3>
                <div class="date-dropdowns">
                    <select id="sel-year" class="sel-year">
                        <option>2024年</option>
                        <option>2025年</option>
                        <option>2026年</option>
                        <option>2027年</option>
                        <option>2028年</option>
                        <option>2029年</option>
                        <option>2030年</option>
                    </select>
                    <select id="sel-month" class="sel-month">
                        <option>1月</option>
                        <option>2月</option>
                        <option>3月</option>
                        <option>4月</option>
                        <option>5月</option>
                        <option>6月</option>
                        <option>7月</option>
                        <option>8月</option>
                        <option>9月</option>
                        <option>10月</option>
                        <option>11月</option>
                        <option>12月</option>
                    </select>
                    <select id="sel-day" class="sel-day">
                        <option>1日</option>
                        <option>2日</option>
                        <option>3日</option>
                        <option>4日</option>
                        <option>5日</option>
                        <option>6日</option>
                        <option>7日</option>
                        <option>8日</option>
                        <option>9日</option>
                        <option>10日</option>
                        <option>11日</option>
                        <option>12日</option>
                        <option>13日</option>
                        <option>14日</option>
                        <option>15日</option>
                        <option>16日</option>
                        <option>17日</option>
                        <option>18日</option>
                        <option>19日</option>
                        <option>20日</option>
                        <option>21日</option>
                        <option>22日</option>
                        <option>23日</option>
                        <option>24日</option>
                        <option>25日</option>
                        <option>26日</option>
                        <option>27日</option>
                        <option>28日</option>
                        <option>29日</option>
                        <option>30日</option>
                        <option>31日</option>
                    </select>
                </div>

                <div class="shift-view">

                    <div class="view-area">
                        <table class="shift-grid" id="shift-grid-table">
                            <thead>
                                <tr>
                                    <th class="col-name">名前</th>
                                    <th>6:00</th>
                                    <th>7:00</th>
                                    <th>8:00</th>
                                    <th>9:00</th>
                                    <th>10:00</th>
                                    <th>11:00</th>
                                    <th>12:00</th>
                                    <th>13:00</th>
                                    <th>14:00</th>
                                    <th>15:00</th>
                                    <th>16:00</th>
                                    <th>17:00</th>
                                    <th>18:00</th>
                                    <th>19:00</th>
                                    <th>20:00</th>
                                    <th>21:00</th>
                                </tr>
                            </thead>
                            <tbody id="shift-grid-body">
                            </tbody>
                        </table>
                    </div>

                    <div class="edit-area">
                        <select class="employee-select" id="employee-select">
                        </select>
                        <select id="shift-select" class="shift-select">
                        </select>
                        <div class="time-range">
                            <div class="time-range">
                                <select id="start-time" class="time-input">
                                    <option value="">開始時間</option>
                                    <option value="06:00">06:00</option>
                                    <option value="06:30">06:30</option>
                                    <option value="07:00">07:00</option>
                                    <option value="07:30">07:30</option>
                                    <option value="08:00">08:00</option>
                                    <option value="08:30">08:30</option>
                                    <option value="09:00">09:00</option>
                                    <option value="09:30">09:30</option>
                                    <option value="10:00">10:00</option>
                                    <option value="10:30">10:30</option>
                                    <option value="11:00">11:00</option>
                                    <option value="11:30">11:30</option>
                                    <option value="12:00">12:00</option>
                                    <option value="12:30">12:30</option>
                                    <option value="13:00">13:00</option>
                                    <option value="13:30">13:30</option>
                                    <option value="14:00">14:00</option>
                                    <option value="14:30">14:30</option>
                                    <option value="15:00">15:00</option>
                                    <option value="15:30">15:30</option>
                                    <option value="16:00">16:00</option>
                                    <option value="16:30">16:30</option>
                                    <option value="17:00">17:00</option>
                                    <option value="17:30">17:30</option>
                                    <option value="18:00">18:00</option>
                                    <option value="18:30">18:30</option>
                                    <option value="19:00">19:00</option>
                                    <option value="19:30">19:30</option>
                                    <option value="20:00">20:00</option>
                                    <option value="20:30">20:30</option>
                                    <option value="21:00">21:00</option>
                                </select>
                                <span style="font-weight: bold; padding: 0 5px;">〜</span>
                                <select id="end-time" class="time-input">
                                    <option value="">終了時間</option>
                                    <option value="06:00">06:00</option>
                                    <option value="06:30">06:30</option>
                                    <option value="07:00">07:00</option>
                                    <option value="07:30">07:30</option>
                                    <option value="08:00">08:00</option>
                                    <option value="08:30">08:30</option>
                                    <option value="09:00">09:00</option>
                                    <option value="09:30">09:30</option>
                                    <option value="10:00">10:00</option>
                                    <option value="10:30">10:30</option>
                                    <option value="11:00">11:00</option>
                                    <option value="11:30">11:30</option>
                                    <option value="12:00">12:00</option>
                                    <option value="12:30">12:30</option>
                                    <option value="13:00">13:00</option>
                                    <option value="13:30">13:30</option>
                                    <option value="14:00">14:00</option>
                                    <option value="14:30">14:30</option>
                                    <option value="15:00">15:00</option>
                                    <option value="15:30">15:30</option>
                                    <option value="16:00">16:00</option>
                                    <option value="16:30">16:30</option>
                                    <option value="17:00">17:00</option>
                                    <option value="17:30">17:30</option>
                                    <option value="18:00">18:00</option>
                                    <option value="18:30">18:30</option>
                                    <option value="19:00">19:00</option>
                                    <option value="19:30">19:30</option>
                                    <option value="20:00">20:00</option>
                                    <option value="20:30">20:30</option>
                                    <option value="21:00">21:00</option>
                                </select>
                            </div>
                        </div>
                        <button id="btn-save-shift" class="btn-save">保存</button>
                        <div class="edit-btns" id="edit-btns">
                            <button class="emp-edit" id="emp-edit">従業員を編集</button>
                            <button class="position-edit" id="position-edit">ポジションを編集</button>
                        </div>
                    </div>
                </div>


            </div>


            <div class="emp-manage-card" id="emp-manage-card" style="display: none;">
                <h3 class="card-title"><i class="fa-solid fa-users"></i> 従業員管理</h3>
                <button id="close-btn" class="close-btn">×</button>
                <div class="add-emp-row">
                    <input type="text" id="new-emp-name" class="new-emp-name" placeholder="新しい従業員の名前">
                    <input type="text" id="new-emp-id" class="new-emp-id" placeholder="従業員メールアドレス">
                    <input type="text" id="new-emp-password" class="new-emp-password" placeholder="パスワード">
                    <button id="btn-add-emp" class="btn-add-emp">追加</button>
                </div>
                <ul id="emp-list" class="emp-list-ui">
                </ul>
            </div>

            <div class="position-manage-card" id="position-manage-card" style="display: none;">
                <h3 class="card-title">ポジション管理</h3>
                <button id="close-btn2" class="close-btn">×</button>
                <div class="add-position">
                    <input type="text" id="position-name" class="position-name" placeholder="新しいポジション">
                    <input type="color" id="position-color" class="position-color" placeholder="ポジションのカラー">
                    <button id="btn-add-position" class="btn-add-emp">追加</button>
                </div>
                <div class="show-position" id="show-position">
                </div>
            </div>

        </div>

        <div id="shift-popup" class="popup-overlay hidden">
            <div class="popup-content">
                <div class="popup-header">
                    <h3 id="popup-date-title"></h3>
                    <button id="close-popup-btn" class="popup-close-btn">×</button>
                </div>
                <div class="popup-body">
                    <div class="view-area">
                        <table class="shift-grid" id="shift-grid-table">
                            <thead>
                                <tr>
                                    <th class="col-name">名前</th>
                                    <th>6:00</th>
                                    <th>7:00</th>
                                    <th>8:00</th>
                                    <th>9:00</th>
                                    <th>10:00</th>
                                    <th>11:00</th>
                                    <th>12:00</th>
                                    <th>13:00</th>
                                    <th>14:00</th>
                                    <th>15:00</th>
                                    <th>16:00</th>
                                    <th>17:00</th>
                                    <th>18:00</th>
                                    <th>19:00</th>
                                    <th>20:00</th>
                                    <th>21:00</th>
                                </tr>
                            </thead>
                            <tbody id="popup-shift-grid-body">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>


        <nav id="btn-nav" class="btn-nav hidden">
            <div class="myshift-tab" id="myshift-tub"><i class="fa-solid fa-list-ul"></i><span>マイシフト</span></div>
            <div class="allshift-tab" id="allshiht-tub"><i class="fa-regular fa-calendar"></i><span>全体シフト</span>
            </div>
            <div id="tab-admin" class="admin-tab"><i class="fa-solid fa-gear"></i><span>管理者設定</span></div>
        </nav>

        <script type="module" src="./js/app.js"></script>
</body>

</html>
